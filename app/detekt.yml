# detekt 覆盖配置(合并到 buildUponDefaultConfig 的默认规则之上,只写差异项)。
naming:
  FunctionNaming:
    # Jetpack Compose @Composable 函数按官方惯例用 PascalCase(如 MyScreen()),
    # 与普通函数命名规则冲突。豁免,避免每写一个 Composable 就被静态门禁误拦。
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # 已提取到具名常量声明(如 val ScrimColor = Color(0x..))的字面量视为合规——
    # 否则"提成命名常量"这条 detekt 自己的建议反而无法满足。
    ignorePropertyDeclaration: true
