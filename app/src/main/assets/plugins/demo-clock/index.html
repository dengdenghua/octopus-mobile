<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 IP</title>
  <style>
    body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#0f0c29;
           color:#fff; height:100vh; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:20px; }
    .card { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
            border-radius:20px; padding:28px 36px; text-align:center; }
    h1 { font-size:18px; font-weight:600; margin:0 0 6px; }
    .sub { font-size:12px; color:#b9b4e0; margin-bottom:18px; }
    #ip { font-size:26px; font-weight:700; color:#a78bfa; }
    button { margin-top:18px; background:#6d5dfc; color:#fff; border:none; border-radius:12px;
             padding:11px 22px; font-size:14px; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>示例小程序</h1>
    <div class="sub">通过 octopus.callTool 桥调用 get_my_ip</div>
    <div id="ip">…</div>
    <div id="note" style="margin-top:12px;font-size:13px;color:#ffe27a;min-height:16px;"></div>
    <button onclick="loadIp()">刷新</button>
  </div>
  <script>
    function loadIp() {
      var el = document.getElementById('ip');
      el.textContent = '查询中…';
      try {
        if (!window.octopus) { el.textContent = '桥未注入'; return; }
        var r = window.octopus.callTool('get_my_ip', {});
        if (r && r.ok) {
          var ip = r.data;
          try { ip = JSON.parse(r.data).ip || r.data; } catch (e) {}
          el.textContent = ip;
        } else {
          el.textContent = '失败: ' + (r && r.error ? r.error : 'unknown');
        }
      } catch (e) {
        el.textContent = '异常: ' + e.message;
      }
      // mini-app → Agent:上报"刷新"发生了(Agent 可感知)
      if (window.octopus && octopus.reportAction) octopus.reportAction('refreshed', {});
    }

    // Agent → mini-app:处理 app_action 派发来的动作(移植 OpenRoom onAgentAction)
    function registerAgentActions() {
      if (!window.octopus) { setTimeout(registerAgentActions, 200); return; }
      octopus.onAgentAction = function (actionType, params) {
        if (actionType === 'refresh') { loadIp(); return 'refreshing'; }
        if (actionType === 'set_note') {
          document.getElementById('note').textContent = (params && params.text) || '';
          return 'note updated';
        }
        return 'unknown action: ' + actionType;
      };
    }
    registerAgentActions();

    // 等 octopus shim 注入后再调
    setTimeout(loadIp, 300);
  </script>
</body>
</html>
