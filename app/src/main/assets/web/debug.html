<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octopus Mobile Debug Console</title>
<link rel="stylesheet" href="debug-style.css">
</head>
<body>

<h1>Debug Console</h1>
<p class="subtitle">Test tool capabilities remotely</p>

<div class="layout">
  <!-- Main Content -->
  <div class="main-content">
    <div class="quick-actions">
      <button class="quick-btn" data-tool="get_screen_info">Screen Info</button>
      <button class="quick-btn" data-tool="find_node_info">Node Tree</button>
      <button class="quick-btn" data-tool="take_screenshot">Screenshot</button>
      <button class="quick-btn" data-tool="get_installed_apps">App List</button>
    </div>

    <div class="search-box">
      <input class="search-input" id="searchInput" type="text" placeholder="Search tools..." autocomplete="off">
    </div>

    <div class="tool-list" id="toolList">Loading tools...</div>

    <div class="panel" id="toolPanel" style="display:none">
      <div class="panel-title" id="toolName"></div>
      <div class="panel-desc" id="toolDesc"></div>
      <div id="paramFields"></div>
      <button class="exec-btn" id="execBtn">Execute</button>
    </div>

    <div class="result-panel" id="resultPanel" style="display:none">
      <div class="result-header">
        <span class="result-status" id="resultStatus"></span>
        <span class="result-time" id="resultTime"></span>
      </div>
      <div class="response-time-bar" id="responseTimeBar" style="display:none">
        <div class="bar-track"><div class="bar-fill"></div></div>
        <span class="bar-label"></span>
      </div>
      <pre class="result-body" id="resultBody"></pre>
      <img class="result-image" id="resultImage" />
    </div>
  </div>

  <!-- History Sidebar -->
  <div class="history-sidebar">
    <div class="history-panel">
      <div class="history-title">
        <span>History</span>
        <button class="history-clear-btn" id="historyClearBtn">Clear</button>
      </div>
      <div class="history-empty" id="historyEmpty">No executions yet</div>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>
</div>

<script src="debug-app.js"></script>
</body>
</html>
