<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octopus 网页遥控台</title>
<link rel="stylesheet" href="console-style.css">
</head>
<body>
<div id="app">
  <div id="left">
    <div class="ltbar">
      <b style="font-size:13px">🖥 手机</b><span id="st">连接中…</span>
      <span id="latency">-- ms</span>
      <button data-action="back">返回</button>
      <button data-action="home">主屏</button>
      <button data-action="recent">最近</button>
      <button data-key="67">⌫</button>
      <button id="reloadBtn">刷新</button>
    </div>
    <div id="stage"><img id="screen" draggable="false"><div id="msg2"></div></div>
  </div>
  <div id="right">
    <div class="rtbar">💬 与任务助手对话（控制手机）<span id="run"></span></div>
    <div id="chat"></div>
    <div id="inputrow">
      <textarea id="ta" placeholder="对任务助手说…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send">发送</button>
    </div>
  </div>
</div>

<!-- 快捷键帮助面板 -->
<div id="help-panel">
  <h3>⌨ 快捷键</h3>
  <div class="row"><span class="desc">显示/隐藏帮助</span><kbd>?</kbd></div>
  <div class="row"><span class="desc">发送消息</span><kbd>Enter</kbd></div>
  <div class="row"><span class="desc">换行</span><kbd>Shift+Enter</kbd></div>
</div>

<script src="console-app.js"></script>
</body>
</html>
