<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octopus 网页遥控 + 对话</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0e0e12;font-family:-apple-system,system-ui,sans-serif;color:#eee;overflow:hidden}
  #app{display:flex;height:100vh}
  /* 左:手机镜像 */
  #left{display:flex;flex-direction:column;background:#000;border-right:1px solid #2a2a33;flex:0 0 auto}
  .ltbar{height:44px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#1b1b22;border-bottom:1px solid #2a2a33;white-space:nowrap}
  .ltbar button{background:#2a2a33;color:#eee;border:1px solid #3a3a46;border-radius:6px;padding:6px 9px;font-size:12px;cursor:pointer}
  .ltbar button:active{background:#3a6}
  #st{font-size:11px;color:#8ab4f8;margin-left:4px}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;min-height:0}
  #screen{max-height:100%;max-width:46vw;cursor:crosshair;user-select:none;-webkit-user-drag:none}
  #msg2{position:absolute;bottom:8px;left:8px;color:#999;font-size:11px;max-width:44vw}
  /* 右:对话 */
  #right{flex:1;display:flex;flex-direction:column;background:#0e0e12;min-width:0}
  .rtbar{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#1b1b22;border-bottom:1px solid #2a2a33;font-size:14px}
  .rtbar #run{font-size:11px;color:#f5a}
  #chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
  .b{max-width:80%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .user{align-self:flex-end;background:#2563c9;color:#fff;border-bottom-right-radius:3px}
  .asst{align-self:flex-start;background:#23232c;color:#eee;border-bottom-left-radius:3px}
  .tool{align-self:flex-start;font-size:12px;color:#9bd0a0;background:rgba(60,120,70,.12);padding:4px 9px;border-radius:8px}
  .err{align-self:flex-start;color:#f99;background:rgba(180,40,40,.15);padding:6px 10px;border-radius:8px;font-size:13px}
  #inputrow{display:flex;gap:8px;padding:10px;border-top:1px solid #2a2a33}
  #ta{flex:1;background:#101015;color:#eee;border:1px solid #3a3a46;border-radius:8px;padding:9px;font-size:14px;resize:none;height:42px;max-height:120px}
  #send{background:#2e9e5b;color:#fff;border:none;border-radius:8px;padding:0 18px;font-size:14px;cursor:pointer}
  #send:disabled{background:#444;cursor:default}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div class="ltbar">
      <b style="font-size:13px">🖥 手机</b><span id="st">连接中…</span>
      <button onclick="act('back')">返回</button>
      <button onclick="act('home')">主屏</button>
      <button onclick="act('recent')">最近</button>
      <button onclick="key(67)">⌫</button>
      <button onclick="reload()">刷新</button>
    </div>
    <div id="stage"><img id="screen" draggable="false"><div id="msg2"></div></div>
  </div>
  <div id="right">
    <div class="rtbar">💬 与 Agent 对话（控制手机）<span id="run"></span></div>
    <div id="chat"></div>
    <div id="inputrow">
      <textarea id="ta" placeholder="对 Agent 说…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send" onclick="send()">发送</button>
    </div>
  </div>
</div>
<script>
  const q=new URLSearchParams(location.search), TOKEN=q.get('token')||'';
  let DW=1080, DH=2400;
  const img=document.getElementById('screen'), st=document.getElementById('st'), msg2=document.getElementById('msg2');
  const chat=document.getElementById('chat'), ta=document.getElementById('ta'), sendBtn=document.getElementById('send'), runEl=document.getElementById('run');
  function api(p){ return p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(TOKEN); }
  function post(action,body){ return fetch(api('/api/control/input'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action},body||{}))}).catch(()=>{}); }
  function act(a){ post(a); } function key(c){ post('key',{keyCode:c}); }

  /* ── 左:手机镜像 + 控制 ── */
  async function initMirror(){
    if(!TOKEN){ st.textContent='○ 无 token'; msg2.textContent='用 …/console?token=你的token 打开'; return; }
    try{ const j=await (await fetch(api('/api/screen/info'))).json(); if(j&&j.data){DW=j.data.width;DH=j.data.height;} }catch(e){}
    img.onload=()=>{ st.textContent='● '+DW+'×'+DH; msg2.textContent=''; };
    img.onerror=()=>{ st.textContent='○ 流断'; msg2.textContent='屏幕流断开,点刷新(确认 token / ConfigServer / 无障碍)'; };
    reload();
  }
  function reload(){ img.src=api('/api/screen/stream?maxWidth=720&fps=12&quality=50&_='+Date.now()); }
  function toDev(cx,cy){ const r=img.getBoundingClientRect();
    return {x:Math.round(Math.min(1,Math.max(0,(cx-r.left)/r.width))*DW), y:Math.round(Math.min(1,Math.max(0,(cy-r.top)/r.height))*DH)}; }
  let down=null,lp=null,moved=false;
  img.addEventListener('mousedown',e=>{ down=toDev(e.clientX,e.clientY); down.t=Date.now(); moved=false;
    lp=setTimeout(()=>{ if(down&&!moved){ post('long_press',{x:down.x,y:down.y,duration:600}); down=null; } },520); });
  img.addEventListener('mousemove',e=>{ if(down){ const p=toDev(e.clientX,e.clientY); if(Math.hypot(p.x-down.x,p.y-down.y)>20)moved=true; } });
  img.addEventListener('mouseup',e=>{ if(lp){clearTimeout(lp);lp=null;} if(!down)return; const up=toDev(e.clientX,e.clientY);
    if(Math.hypot(up.x-down.x,up.y-down.y)>20) post('swipe',{x1:down.x,y1:down.y,x2:up.x,y2:up.y,duration:Math.min(800,Math.max(120,Date.now()-down.t))});
    else post('tap',{x:up.x,y:up.y}); down=null; });
  img.addEventListener('mouseleave',()=>{ if(lp){clearTimeout(lp);lp=null;} down=null; });
  img.addEventListener('wheel',e=>{ e.preventDefault(); const r=img.getBoundingClientRect(); const c=toDev(r.left+r.width/2,r.top+r.height/2);
    const dy=e.deltaY>0?-500:500; post('swipe',{x1:c.x,y1:c.y,x2:c.x,y2:Math.min(DH,Math.max(0,c.y+dy)),duration:200}); },{passive:false});

  /* ── 右:对话(轮询 Agent 事件) ── */
  let cursor=0, curAsst=null;
  function bubble(cls,text){ const d=document.createElement('div'); d.className='b '+cls; d.textContent=text; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }
  function applyEvent(ev){
    if(ev.type==='user'){ bubble('user',ev.data); curAsst=null; }
    else if(ev.type==='text'){ if(!curAsst) curAsst=bubble('asst',''); curAsst.textContent+=ev.data; chat.scrollTop=chat.scrollHeight; }
    else if(ev.type==='tool'){ bubble('tool','🔧 '+ev.data); curAsst=null; }
    else if(ev.type==='done'){ if((!curAsst||!curAsst.textContent)&&ev.data) bubble('asst',ev.data); curAsst=null; }
    else if(ev.type==='error'){ bubble('err','⚠ '+ev.data); curAsst=null; }
  }
  async function poll(){
    try{
      const j=await (await fetch(api('/api/agent/events?since='+cursor))).json();
      if(j&&j.events){ for(const ev of j.events){ applyEvent(ev); cursor=ev.i+1; } }
      const running=j&&j.running;
      sendBtn.disabled=!!running; runEl.textContent=running?'Agent 运行中…':'';
    }catch(e){}
    setTimeout(poll, 800);
  }
  async function send(){
    const t=ta.value.trim(); if(!t) return;
    ta.value=''; sendBtn.disabled=true;
    await fetch(api('/api/agent/run'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:t})}).catch(()=>{});
  }
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });

  initMirror(); poll();
</script>
</body>
</html>
