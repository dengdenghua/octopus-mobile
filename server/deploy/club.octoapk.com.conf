# club.octoapk.com —— 技能中心 / 广场子域。
# 反代到同一个 FastAPI(app:app @ 127.0.0.1:8081)——它已含 /square/feed、/square/discovery、/config。
#
# 安装:
#   sudo cp club.octoapk.com.conf /etc/nginx/sites-available/club.octoapk.com.conf
#   sudo ln -s /etc/nginx/sites-available/club.octoapk.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d club.octoapk.com      # 申请 Let's Encrypt 证书并自动补 443 段
#
# (更省事的替代:不新建本文件，直接把 `club.octoapk.com` 加进现有 api 的 server_name，共用一张证书。)

server {
    listen 80;
    listen [::]:80;
    server_name club.octoapk.com;

    # 首次签发走 HTTP-01；certbot --nginx 之后会自动追加 listen 443 ssl + 证书路径 + http→https 跳转。

    # 隐藏 nginx 版本，减少信息泄漏
    server_tokens off;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # 固定 Host 为 server_name，防止客户端 Host 注入导致 /config 派生恶意子域
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 透传(若 club 也复用远程控制台后端)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 可选:只把技能中心相关路由暴露在 club，其余 404(取消注释启用)
    # location / { return 404; }
    # location /square/ { proxy_pass http://127.0.0.1:8081; include /etc/nginx/proxy_params; proxy_set_header Host $server_name; }
    # location = /config { proxy_pass http://127.0.0.1:8081; include /etc/nginx/proxy_params; proxy_set_header Host $server_name; }
}
